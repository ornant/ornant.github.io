name: Deploy

# Runs when you push to main (or press "Run workflow"). No schedules.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# The only build tool: one pinned Hugo release, checked against this hash.
# To update: pick a release at least 7 days old, copy the sha256 of
# hugo_<version>_linux-amd64.tar.gz from its hugo_<version>_checksums.txt.
env:
  HUGO_VERSION: 0.166.0
  HUGO_SHA256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          tar -xzf hugo.tar.gz hugo
      # base_url is https://<user>.github.io/<repo> or your custom domain.
      - run: '"$RUNNER_TEMP/hugo" --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
